<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Specialties Finder</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><filter id='glow'><feDropShadow dx='0' dy='0' stdDeviation='2' flood-color='white' flood-opacity='0.8'/></filter><g filter='url(%23glow)'><rect width='15' height='62.367' x='76.95' y='57.266' opacity='.35' transform='rotate(-45.001 84.45 88.451)'/><rect width='15' height='62.367' x='76.95' y='53.266' fill='%230037ff' transform='rotate(-45.001 84.45 84.451)'/><circle cx='49' cy='53' r='37' opacity='.35'/><circle cx='49' cy='49' r='37' fill='%230075ff'/><circle cx='49' cy='53' r='28' opacity='.35'/><circle cx='49' cy='49' r='28' fill='%23a4e2f1'/></g></svg>"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Specialties Finder</h1>

    <input type="file" id="csvFile" accept=".csv" autocomplete="off" />

    <div class="resetSpace">
      <button type="button" id="resetApp">Reset & Upload New File</button>
    </div>

    <div class="container">
      <section class="boxOne">
        <section class="inputSpecialties">
          <label>Enter Specialties:</label>
          <textarea
            id="specialty"
            rows="5"
            cols="50"
            autocomplete="off"
            placeholder="Enter one specialty per line...

Cardiology
Pediatrics
E.N.T."
          ></textarea>
          <button type="button" id="submitButton">Submit</button>
        </section>
        <section class="result">
          <button type="button" id="findCommon">Find Common Ones</button>
          <div class="outputContainer">
            <p class="infoPara"></p>
            <div class="heading">
              <h3><u>Common</u> <u>Specialties</u></h3>
              <button class="copy" id="commonText">Copy</button>
            </div>
            <div class="commonSpecialties"></div>
            <div class="heading">
              <h3><u>Uncommon</u> <u>Specialties</u></h3>
              <button class="copy" id="unCommonText">Copy</button>
            </div>
            <div class="unCommonSpecialties"></div>
          </div>
        </section>
      </section>

      <section class="boxTwo"><table id="tableData"></table></section>
    </div>

    <button id="backToTop">
      <img
        width="70"
        height="70"
        src="https://img.icons8.com/bubbles/100/long-arrow-up.png"
        alt="long-arrow-up"
      />
    </button>

    <script src="script.js"></script>
  </body>
</html>
